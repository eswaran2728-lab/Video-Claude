  <div id="root" data-composition-id="subs" data-width="1920" data-height="1080">
    <div id="sub-1A" class="sub clip" data-start="1.80" data-duration="4.71"><span>ஒரு கம்பின் ஓசையில் ஒரு தலைமுறையின் நினைவு இருக்கிறது.</span></div>
    <div id="sub-1B" class="sub clip" data-start="21.00" data-duration="4.00"><span>அந்த ஓசை இன்றும் பயிற்சிக் கூடத்தில் கேட்கிறது.</span></div>
    <div id="sub-1C" class="sub clip" data-start="30.10" data-duration="5.44"><span>அந்தப் பயிற்சியின் பின்னால் ஓர் ஆசானின் வாழ்நாள் உழைப்பு இருக்கிறது.</span></div>
    <div id="sub-1D" class="sub clip" data-start="41.20" data-duration="3.68"><span>அவர் ஸ்ரீ எஸ். ஆறுமுகம்.</span></div>
    <div id="sub-2A" class="sub clip" data-start="49.80" data-duration="4.61"><span>மலேசியாவின் தோட்டப்புறத்தில் இந்தப் பயணம் தொடங்குகிறது.</span></div>
    <div id="sub-2B" class="sub clip" data-start="58.40" data-duration="5.89"><span>முதலில் அவர் பார்த்தார். பார்த்ததையே மனதில் பதித்துக்கொண்டார்.</span></div>
    <div id="sub-2C" class="sub clip" data-start="69.00" data-duration="3.49"><span>பிறகு ஒரு மூங்கில் கம்பைக் கையில் எடுத்தார்.</span></div>
    <div id="sub-2D" class="sub clip" data-start="78.60" data-duration="3.73"><span>முதல் முயற்சியிலேயே எல்லாம் கைகூடவில்லை.</span></div>
    <div id="sub-3A" class="sub clip" data-start="88.20" data-duration="3.88"><span>தடுமாறிய போதும், அவர் பயிற்சியை விடவில்லை.</span></div>
    <div id="sub-3B" class="sub clip" data-start="97.80" data-duration="3.67"><span>மறுநாளும் அதே இடத்துக்கு அவர் திரும்பினார்.</span></div>
    <div id="sub-3C" class="sub clip" data-start="107.40" data-duration="3.70"><span>கம்பின் பிடியிலும் காலடியிலும் கவனம் வைத்தார்.</span></div>
    <div id="sub-3D" class="sub clip" data-start="117.00" data-duration="4.07"><span>நாள்தோறும் செய்த பயிற்சியே அவருக்குத் துணையானது.</span></div>
    <div id="sub-4A" class="sub clip" data-start="126.10" data-duration="4.81"><span>அவர் கற்ற கலையை மற்றவர்களுக்கும் கற்றுக்கொடுக்கத் தொடங்கினார்.</span></div>
    <div id="sub-4B" class="sub clip" data-start="137.20" data-duration="4.03"><span>அவசரம் வேண்டாம். முதலில் நிதானமா நில்.</span></div>
    <div id="sub-4C" class="sub clip" data-start="145.80" data-duration="3.84"><span>அந்தச் சிறிய வகுப்பில் பொறுமைக்கும் இடம் இருந்தது.</span></div>
    <div id="sub-4D" class="sub clip" data-start="155.40" data-duration="4.61"><span>ஒரு மாணவரில் தொடங்கிய பயிற்சி ஒரு வகுப்பாக வளர்ந்தது.</span></div>
    <div id="sub-5A" class="sub clip" data-start="165.00" data-duration="3.38"><span>பயிற்சியைத் தேடி வந்தவர்களிடம் அவர் சென்றார்.</span></div>
    <div id="sub-5B" class="sub clip" data-start="174.60" data-duration="3.66"><span>அவரோடு மூங்கில் கம்புகளும் பயணம் செய்தன.</span></div>
    <div id="sub-5C" class="sub clip" data-start="184.20" data-duration="3.94"><span>இன்னொரு தோட்டத்தில் புதிய மாணவர்கள் காத்திருந்தார்கள்.</span></div>
    <div id="sub-5D" class="sub clip" data-start="193.80" data-duration="5.05"><span>இடங்கள் மாறின. பயிற்சியின் ஒழுக்கம் மாறவில்லை.</span></div>
    <div id="sub-6A" class="sub clip" data-start="203.40" data-duration="4.21"><span>பயிற்சிக் கூடத்தைத் தாண்டி, கலை மேடைக்கு வந்தது.</span></div>
    <div id="sub-6B" class="sub clip" data-start="214.00" data-duration="3.93"><span>பயப்படாதே. பயிற்சியில செய்ததையே செய்.</span></div>
    <div id="sub-6D" class="sub clip" data-start="232.20" data-duration="4.27"><span>மேடையிலும் தெரிந்தது அன்றாடப் பயிற்சியின் நிதானம்.</span></div>
    <div id="sub-7A" class="sub clip" data-start="241.80" data-duration="4.13"><span>சிலம்பத்தைப் பற்றி அறிய ஒரு ஆய்வாளர் வந்தார்.</span></div>
    <div id="sub-7B" class="sub clip" data-start="250.90" data-duration="5.33"><span>கம்பின் அசைவோடு, பயிற்சியின் ஒழுக்கத்தையும் அவர் கவனித்தார்.</span></div>
    <div id="sub-7C" class="sub clip" data-start="261.50" data-duration="3.35"><span>மாணவர்களுக்கு முதலில் எதைக் கற்றுக்கொடுப்பீர்கள்?</span></div>
    <div id="sub-7D" class="sub clip" data-start="271.60" data-duration="4.23"><span>முதலில் ஒழுக்கம். அதுக்குப் பிறகுதான் கம்பு.</span></div>
    <div id="sub-8A" class="sub clip" data-start="279.70" data-duration="4.68"><span>பயிற்சிக்கூடத்தில் தொடங்கிய உழைப்புக்கு அங்கீகாரம் கிடைத்தது.</span></div>
    <div id="sub-8B" class="sub clip" data-start="288.80" data-duration="5.96"><span>அந்த அங்கீகாரம், சிலம்பத்தை வளர்த்த உழைப்புக்குக் கிடைத்த மரியாதை.</span></div>
    <div id="sub-8C" class="sub clip" data-start="299.40" data-duration="4.40"><span>ஒரு தலைமுறை கற்றதை அடுத்த தலைமுறைக்குக் கொடுத்தது.</span></div>
    <div id="sub-8D" class="sub clip" data-start="309.00" data-duration="4.02"><span>அங்கீகாரம் கிடைத்த பின்னும், பயிற்சி தொடர்ந்தது.</span></div>
    <div id="sub-9A" class="sub clip" data-start="318.60" data-duration="4.24"><span>இப்போது அந்தக் கம்பை ஏந்துவது இன்னொரு தலைமுறை.</span></div>
    <div id="sub-9B" class="sub clip" data-start="329.20" data-duration="4.58"><span>நிதானமா. இன்னொரு தடவை பார்ப்போம்.</span></div>
    <div id="sub-9C" class="sub clip" data-start="337.30" data-duration="4.06"><span>ஆசான் கற்றுத்தந்ததை அவர்கள் தொடர்ந்து பயில்கிறார்கள்.</span></div>
    <div id="sub-9D" class="sub clip" data-start="347.40" data-duration="4.12"><span>இனி இந்த மரபைத் தொடர்வது அவர்களின் பொறுப்பு.</span></div>
