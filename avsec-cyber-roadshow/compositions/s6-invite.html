  </div>

  <script>
    (function () {
      const A = window.AVSEC;
      const qrBox = document.querySelector("#s6-qr");
      const urlEl = document.querySelector("#s6-url");

      if (A.urlOk) {
        // QR built from the same URL that is printed below it.
        const qr = qrcode(0, "M");
        qr.addData(A.url);
        qr.make();
        const n = qr.getModuleCount();
        const quiet = 4;
        const k = Math.floor(460 / (n + quiet * 2));
        const size = k * (n + quiet * 2);
        let d = "";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${(c + quiet) * k} ${(r + quiet) * k}h${k}v${k}h-${k}z`;
        qrBox.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#ffffff"/><path d="${d}" fill="#141417"/></svg>`;
        urlEl.textContent = A.urlLabel;
      } else {
        qrBox.innerHTML = '<div id="s6-qr-pending">QR CODE PENDING<br/>add challengeUrl in data/leaderboard.js</div>';
        urlEl.textContent = A.urlLabel;
        urlEl.classList.add("pending");
      }

      A.logoLockup(document.querySelector("#s6-logos"), {
        heights: { avsec: 190, allstars: 128 },
        divider: "rgba(255,255,255,0.3)",
        placeholder: "rgba(255,255,255,0.7)",
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s6-grid", { y: 0 }, { y: 60, duration: 6, ease: "none" }, 0);
      tl.fromTo("#s6-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.6);

      tl.fromTo("#s6-q span", { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.26, ease: "expo.out", stagger: 0.09 }, 0.02);
      tl.fromTo("#s6-try span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.06 }, 0.5);

      // QR card arrives, settles, and then never moves again.
      tl.fromTo("#s6-card", { opacity: 0, scale: 0.82, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" }, 0.9);
      tl.fromTo(".s6-br", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)", stagger: 0.04 }, 1.3);
      tl.fromTo("#s6-url", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "steps(22)" }, 1.4);

      tl.fromTo("#s6-spot span", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.28, ease: "expo.out", stagger: 0.07 }, 1.6);
      tl.fromTo("#s6-logos", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.95);
      tl.fromTo("#s6-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["s6"] = tl;
    })();
