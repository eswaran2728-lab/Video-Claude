  <script>
    (function () {
      window.AVSEC.logoLockup(document.querySelector("#s1-logos"), {
        heights: { avsec: 176, allstars: 120 },
        divider: "rgba(255,255,255,0.35)",
        placeholder: "rgba(255,255,255,0.7)",
      });
      const tl = gsap.timeline({ paused: true });
      // Scan line: line sits 254px down inside #s1-scan, so y = lineY - 254.
      const L = (lineY) => lineY - 254;

      // Frame 0: the scan line is already on screen at the top edge.
      tl.fromTo("#s1-scan", { y: L(40) }, { y: L(2300), duration: 1.5, ease: "none" }, 0.05);
      // Scan crosses the logos (y 196–372) between ~0.15 s and ~0.27 s.
      tl.fromTo("#s1-logos", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.13, ease: "none" }, 0.15);
      tl.fromTo("#s1-logos", { filter: "brightness(1.8)" }, { filter: "brightness(1)", duration: 0.5, ease: "power2.out" }, 0.22);
      // Scan crosses the headline (y 540–890) between ~0.37 s and ~0.6 s.
      tl.fromTo("#s1-head", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.24, ease: "none" }, 0.38);
      tl.fromTo("#s1-l1", { color: "#ff2d3f", textShadow: "0 0 40px rgba(255,45,63,0.9)" }, { color: "#ffffff", textShadow: "0 0 0px rgba(255,45,63,0)", duration: 0.5, ease: "power2.out" }, 0.48);
      tl.fromTo("#s1-l2", { scale: 1.04, textShadow: "0 0 60px rgba(255,45,63,1)" }, { scale: 1, textShadow: "0 0 18px rgba(255,45,63,0.35)", duration: 0.6, ease: "expo.out" }, 0.56);

      // Scan counter follows the line.
      const pct = { v: 0 };
      const pctEl = document.querySelector("#s1-scanpct");
      tl.fromTo(pct, { v: 0 }, {
        v: 100, duration: 1.2, ease: "none",
        onUpdate: () => { pctEl.textContent = "SCAN " + String(Math.round(pct.v)).padStart(3, "0") + "%"; },
      }, 0.05);

      // HUD corners settle in.
      tl.fromTo("#s1-ghost", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 0.62);
      tl.fromTo(".s1-corner", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", stagger: 0.05 }, 0);
      tl.fromTo("#s1-status", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.1);

      // Reticle locks onto ALLSTARS!
      tl.fromTo("#s1-reticle", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, 1.2);
      tl.fromTo("#s1-detect", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 1.32);

      // Supporting line, word by word.
      tl.fromTo("#s1-sub span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.07 }, 1.8);

      // Event tag.
      tl.fromTo("#s1-tag", { xPercent: -50, opacity: 0, scale: 0.86 }, { xPercent: -50, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 2.55);
      tl.fromTo("#s1-runway i", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out", stagger: 0.03 }, 2.75);

      // World keeps moving under the hold: grid drifts, reticle tag ticks.
      tl.fromTo("#s1-grid", { y: 0 }, { y: 60, duration: 5, ease: "none" }, 0);
      tl.fromTo("#s1-vignette", { opacity: 0.6 }, { opacity: 1, duration: 2, ease: "power1.inOut" }, 1);

      // Exit: the scan sweeps back up and wipes the frame clean.
      tl.fromTo("#s1-scan", { y: L(2300) }, { y: L(-300), duration: 0.42, ease: "power3.in", immediateRender: false }, 4.54);
      tl.fromTo(["#s1-logos", "#s1-head", "#s1-ret", "#s1-sub", "#s1-tagwrap", "#s1-hud"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in", stagger: -0.04, immediateRender: false }, 4.68);

      window.__timelines = window.__timelines || {};
      window.__timelines["s1"] = tl;
    })();
  </script>
