<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
    }
    #s5-stage { position: absolute; inset: 0; color: var(--ink); }
    #s5-crowd {
      position: absolute;
      left: 90px;
      top: 470px;
      width: 900px;
      height: 70px;
    }
    .s5-dot {
      position: absolute;
      top: 21px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    #s5-msg {
      position: absolute;
      left: 0;
      top: 590px;
      width: 1080px;
      text-align: center;
      font-size: 104px;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 1.04;
    }
    #s5-msg span, #s5-safe span { display: inline-block; margin: 0 0.1em; }
    #s5-safe {
      position: absolute;
      left: 0;
      top: 980px;
      width: 1080px;
      text-align: center;
      font-size: 90px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.04;
      color: var(--red);
    }
    .s5-red { color: var(--red); }
  </style>

  <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
    <div id="s5-stage" class="clip" data-start="0" data-duration="4">
      <div id="s5-crowd" data-layout-ignore></div>

      <div id="s5-msg">
        <span>To</span><span>every</span><span>Allstar</span><br /><span>who</span><span>took</span><span>part:</span><br /><span class="s5-red">thank</span><span class="s5-red">you.</span>
      </div>
      <div id="s5-safe"><span>Stay</span><span>alert.</span><br /><span>Stay</span><span>cyber</span><span>safe.</span></div>
    </div>
  </div>

  <script>
    (function () {
      const A = window.AVSEC;

      // A loose line of dots: "everyone else who played". Not a count.
      const crowd = document.querySelector("#s5-crowd");
      const rnd = A.rng(735);
      const dots = [];
      for (let i = 0; i < 24; i++) {
        const d = document.createElement("i");
        d.className = "s5-dot";
        d.style.left = (i * 37.5 + 4) + "px";
        d.style.background = i % 5 === 2 ? "#e8112d" : "#141417";
        d.style.opacity = String(0.25 + rnd() * 0.55);
        crowd.append(d);
        dots.push(d);
      }

      const tl = gsap.timeline({ paused: true });
      // Everyone: the crowd spreads out from the centre, then the message lands.
      tl.fromTo(dots, { scale: 0, x: (i) => (450 - (i * 37.5 + 4)) }, { scale: 1, x: 0, duration: 0.6, ease: "expo.out", stagger: { each: 0.015, from: "center" } }, 0.1);
      tl.fromTo("#s5-msg span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out", stagger: 0.06 }, 0.35);
      tl.fromTo("#s5-safe span", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.07 }, 1.5);
      tl.fromTo("#s5-crowd", { y: 0 }, { y: -10, duration: 3.9, ease: "none" }, 0.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
