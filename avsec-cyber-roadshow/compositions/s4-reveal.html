    #s4-a-img { position: absolute; left: 0; top: 0; width: 1000px; display: block; }

    .s4-q {

    .s4-bracket { position: absolute; left: 54px; width: 972px; }
    .s4-bk { position: absolute; width: 56px; height: 56px; border: 0 solid var(--white); }
    .s4-bk.tl { left: 0; top: 0; border-left-width: 7px; border-top-width: 7px; }

  </style>

  <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
    <div id="s4-stage" class="clip" data-start="0" data-duration="12">
      <div id="s4-ground" data-layout-ignore><div id="s4-grid"></div></div>
      <div id="s4-flood" data-layout-ignore><div id="s4-flood-rays"></div></div>
      <div id="s4-confetti" data-layout-ignore></div>

      <!-- Board A: Spot the Security Risk, the real booth screen (stitched screenshots) -->
      <div id="s4-a" class="s4-board">
        <div id="s4-a-title" class="s4-title">SPOT THE <b>RISK</b> CHALLENGE</div>
        <div id="s4-a-sub" class="s4-sub">BOOTH LEADERBOARD</div>
        <div id="s4-a-panel" class="s4-panel" data-layout-allow-overflow><img id="s4-a-img" src="assets/leaderboard/board.png" alt="" /></div>
        <div id="s4-a-scroll" class="s4-scroll" data-layout-ignore><i id="s4-a-thumb" class="s4-thumb"></i></div>
        <div id="s4-a-br" class="s4-bracket" data-layout-allow-overlap>
          <i class="s4-bk tl"></i><i class="s4-bk tr"></i><i class="s4-bk bl"></i><i class="s4-bk br"></i>
          <div class="s4-chip">TOP 3</div>
        </div>
      </div>

      <!-- Board B: Human Firewall video quiz, typeset from data/leaderboard.js -->
      <div id="s4-b" class="s4-board">
        <div id="s4-b-title" class="s4-title">HUMAN <b>FIREWALL</b> QUIZ</div>
        <div id="s4-b-sub" class="s4-sub">VIDEO QUIZ LEADERBOARD</div>
        <div id="s4-b-panel" class="s4-panel" data-layout-allow-overflow><div id="s4-b-list"></div></div>
        <div id="s4-b-scroll" class="s4-scroll" data-layout-ignore><i id="s4-b-thumb" class="s4-thumb"></i></div>
        <div id="s4-b-br" class="s4-bracket" data-layout-allow-overlap>
          <i class="s4-bk tl"></i><i class="s4-bk tr"></i><i class="s4-bk bl"></i><i class="s4-bk br"></i>
          <div class="s4-chip">TOP 3</div>
        </div>
      </div>

      <div id="s4-white" data-layout-ignore></div>
    </div>
  </div>

  <script>
    (function () {
      const A = window.AVSEC;
      const G = window.AVSEC_BOARD; // geometry written by scripts/stitch_board.py
      const PANEL_TOP = 310, PANEL_H = 990, PANEL_W = 1000, TRACK = 950;

      // ---- Board A: stitched screenshots, shown 1000 px wide.
      const sA = PANEL_W / G.width;
      const aTotal = G.height * sA;
      document.querySelector("#s4-a-img").style.height = aTotal + "px";
      const aRow = (i) => G.rowTops[i] * sA;
      const aMax = Math.max(0, aTotal - PANEL_H);
      const aMid = Math.min(aMax, aRow(6) - 24); // from row 07
      const brA = document.querySelector("#s4-a-br");
      brA.style.top = (PANEL_TOP + aRow(0) - 14) + "px";
      brA.style.height = (aRow(2) + G.rowHeight * sA - aRow(0) + 28) + "px";

      // ---- Board B: video quiz rows from the data block.
      const list = document.querySelector("#s4-b-list");
      const rows = (A.data.videoQuiz || []).slice().sort((x, y) => x.rank - y.rank);
      rows.forEach((r, i) => {
        const el = document.createElement("div");
        el.className = "s4-q" + (i === 0 ? " first" : "");
        const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = "#" + r.rank;
        const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = r.name;
        const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = r.score;
        el.append(rk, nm, sc);
        list.append(el);
      });
      const B_TOP = 26, B_PITCH = 96;
      const bTotal = B_TOP + rows.length * B_PITCH + 14;
      const bMax = Math.max(0, bTotal - PANEL_H);
      const brB = document.querySelector("#s4-b-br");
      brB.style.top = (PANEL_TOP + B_TOP - 14) + "px";
      brB.style.height = (3 * B_PITCH - 12 + 28) + "px";

      // Scroll indicators.
      const thumbH = (total) => Math.max(120, TRACK * Math.min(1, PANEL_H / total));
      document.querySelector("#s4-a-thumb").style.height = thumbH(aTotal) + "px";
      document.querySelector("#s4-b-thumb").style.height = thumbH(bTotal) + "px";
      const thumbY = (off, max, total) => (max > 0 ? (TRACK - thumbH(total)) * off / max : 0);

      // Confetti: seeded, behind the panels, landing in the margins.
      const conf = document.querySelector("#s4-confetti");
      const rnd = A.rng(20261027);
      const bits = [];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement("i");
        el.className = "s4-bit";
        el.style.background = i % 3 === 0 ? "#141417" : "#ffffff";
        conf.append(el);
        const side = i % 3;
        let tx, ty;
        if (side === 0) { tx = 40 + rnd() * 1000; ty = 20 + rnd() * 130; }
        else if (side === 1) { tx = 40 + rnd() * 1000; ty = 1330 + rnd() * 420; }
        else { tx = rnd() < 0.5 ? 2 + rnd() * 30 : 1050 + rnd() * 24; ty = 320 + rnd() * 960; }
        bits.push({ el, tx, ty, rot: (rnd() - 0.5) * 900, fall: 60 + rnd() * 160, s: 0.6 + rnd() * 0.8 });
      }

      const tl = gsap.timeline({ paused: true });

      // One board: arrive, lock the top 3, scroll, leave. stops = [[time, offset], ...]
      function board(p, t0, content, stops, max, total, exit) {
        tl.fromTo(p + "-panel", { y: 1300, opacity: 0, filter: "blur(16px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t0);
        tl.fromTo(p + "-title", { opacity: 0, y: -30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, t0 + 0.08);
        tl.fromTo(p + "-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 0.22);
        tl.fromTo(p + "-scroll", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 0.4);
        tl.fromTo(content, { y: 0 }, { y: 0, duration: 0.01 }, t0);
        tl.fromTo(p + "-thumb", { y: 0 }, { y: 0, duration: 0.01 }, t0);
        tl.fromTo(p + "-br", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, t0 + 0.6);
        tl.to(p + "-br", { opacity: 0, duration: 0.2 }, stops[0][0] - 0.15);
        stops.forEach(([at, off]) => {
          tl.to(content, { y: -off, duration: 0.45, ease: "power3.inOut" }, at);
          tl.to(p + "-thumb", { y: thumbY(off, max, total), duration: 0.45, ease: "power3.inOut" }, at);
        });
        const els = [p + "-title", p + "-sub", p + "-panel", p + "-scroll"];
        if (exit === "up") tl.to(els, { y: "-=1400", filter: "blur(14px)", duration: 0.32, ease: "power3.in" }, t0 + 5.62);
        else tl.to(els, { scale: 0.6, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, t0 + 5.68);
      }

      // Board A (13.0–19.0 s): top 3 held 13.6–15.5, rows 07+ from 15.95, the rest from 17.55.
      board("#s4-a", 0.0, "#s4-a-img", [[2.5, aMid], [4.1, aMax]], aMax, aTotal, "up");
      // Board B (19.0–25.0 s): top 3 held 19.6–21.5, the rest from 21.95.
      board("#s4-b", 6.0, "#s4-b-list", [[8.5, bMax]], bMax, bTotal, "shrink");

      // Each top-3 lock: red flood and confetti behind the panel.
      [[0.6, 2.4], [6.6, 8.4]].forEach(([on, off], k) => {
        tl.fromTo("#s4-flood", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: k === 0 }, on);
        tl.to("#s4-flood", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, off);
        bits.forEach((b, i) => {
          if (i % 2 !== k) return;
          tl.fromTo(b.el, { x: 529, y: 800, rotation: 0, scale: 0.2, opacity: 0 }, { x: b.tx, y: b.ty, rotation: b.rot * 0.4, scale: b.s, opacity: 1, duration: 0.9, ease: "expo.out" }, on + 0.05 + (i % 7) * 0.012);
          tl.to(b.el, { y: b.ty + b.fall, rotation: b.rot, opacity: 0, duration: 1.4, ease: "power1.in" }, on + 0.95);
        });
      });
      tl.fromTo("#s4-flood-rays", { rotation: 0 }, { rotation: 60, duration: 12, ease: "none" }, 0);

      // Hand-off to the light scene.
      tl.fromTo("#s4-white", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 11.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["s4"] = tl;
    })();
  </script>
