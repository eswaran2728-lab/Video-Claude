  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">

    <div id="cg5" class="cap"><span>The process is quite straightforward.</span></div>
    <div id="cg6" class="cap"><span>All you need is your mobile phone, your official AirAsia Google account, and the correct QR code.</span></div>
    <div id="cg7" class="cap"><span>Throughout this briefing, I&#x27;ll guide everyone step by step, explain the common mistakes</span></div>

    <div id="cg9" class="cap"><span>By the end of this briefing, everyone should be able to complete their attendance</span></div>

    <div id="cg13" class="cap"><span>This QR code must be scanned when you start your shift.</span></div>

    <div id="cg17" class="cap"><span>Just remember:</span></div>
    <div id="cg18" class="cap"><span>Green means Check-in, at the start of your shift.</span></div>

    <div id="cg20" class="cap"><span>For both procedures, there are four basic steps:</span></div>

    <div id="cg31" class="cap"><span>Next, check the title displayed at the top of the form.</span></div>

    <div id="cg37" class="cap"><span>Once you have opened the correct Check-in form, you will be required to complete several fields.</span></div>
