<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "MontBlack"; src: url("assets/fonts/Montserrat-Black.ttf") format("truetype"); font-weight: 900; }
      @font-face { font-family: "MontXB"; src: url("assets/fonts/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; }
      @font-face { font-family: "MontB"; src: url("assets/fonts/Montserrat-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0d; }
      body { --red: #ff3b3b; --red2: #d61f26; --ink: rgba(12,12,16,0.78); --glass: rgba(18,18,24,0.62); --line: rgba(255,255,255,0.22); --gold: #f3c969; }
      .clip { position: absolute; inset: 0; }
      .vid { width: 1080px; height: 1920px; object-fit: cover; }
      .pz { position: absolute; inset: 0; overflow: hidden; }
      .pz video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* split layout: proof above, speaker below with a soft blended seam */
      .splitTop { position: absolute; left: 0; top: 0; width: 1080px; height: 1000px; overflow: hidden; }
      .splitTop video { position: absolute; left: 0; top: -460px; width: 1080px; height: 1920px; object-fit: cover; }
      .splitBot { position: absolute; left: 0; top: 960px; width: 1080px; height: 960px; overflow: hidden; }
      .splitBot video { position: absolute; left: 0; top: -130px; width: 1080px; height: 1920px; object-fit: cover; }
      .seam { position: absolute; left: 0; top: 900px; width: 1080px; height: 140px; background: linear-gradient(180deg, rgba(11,11,13,0) 0%, rgba(11,11,13,0.85) 50%, rgba(11,11,13,0) 100%); }

      /* captions */
      .cap { z-index: 20; pointer-events: none; }
      .cap .box { position: absolute; left: 90px; width: 900px; text-align: center; }
      .cap .t { display: inline; font-family: "MontXB"; font-size: 54px; line-height: 1.32; color: #fff; padding: 6px 16px; border-radius: 14px;
        background: rgba(10,10,14,0.62); -webkit-box-decoration-break: clone; box-decoration-break: clone; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
      .cap b { font-family: "MontBlack"; font-weight: 900; color: var(--gold); }
      .sw { display: inline-block; padding: 0 16px; margin: 0 2px; border-radius: 12px; font-family: "MontBlack"; line-height: 1.2; }
      .sw.r { background: var(--red2); color: #fff; }
      .sw.k { background: #050505; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55); }
      .sw.w { background: #f4f4f4; color: #111; text-shadow: none; }

      /* hook */
      #hook { z-index: 15; pointer-events: none; }
      #hook .k1 { position: absolute; left: 0; width: 1080px; top: 330px; text-align: center; font-family: "MontBlack"; font-size: 112px; line-height: 0.98; color: #fff; text-shadow: 0 8px 26px rgba(0,0,0,0.7); }
      #hook .k1 span { color: #fff; background: var(--red2); padding: 0 18px; border-radius: 18px; text-shadow: none; }
      #hook .k2 { position: absolute; left: 0; width: 1080px; top: 580px; text-align: center; }
      #hook .k2 i { font-style: normal; display: inline-block; padding: 10px 26px; border-radius: 40px; background: var(--glass); border: 1px solid var(--line);
        font-family: "MontB"; font-size: 40px; color: #fff; }

      /* glass cards */
      .card { position: absolute; border-radius: 30px; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,0.45); }
      #count { z-index: 15; pointer-events: none; }
      #count .card { left: 712px; top: 760px; width: 300px; height: 176px; text-align: center; }
      #count .n { font-family: "MontBlack"; font-size: 104px; line-height: 1.12; color: #fff; }
      #count .l { margin-top: -6px; font-family: "MontXB"; font-size: 28px; letter-spacing: 6px; color: var(--gold); }
      #cols { z-index: 15; pointer-events: none; }
      #cols .h { position: absolute; left: 0; width: 1080px; top: 300px; text-align: center; font-family: "MontBlack"; font-size: 92px; color: #fff; text-shadow: 0 8px 24px rgba(0,0,0,0.7); }
      #cols .row { position: absolute; left: 0; width: 1080px; top: 420px; display: flex; justify-content: center; gap: 22px; }
      .chip { display: flex; align-items: center; gap: 14px; padding: 14px 26px 14px 16px; border-radius: 40px; background: var(--ink); border: 1px solid var(--line);
        font-family: "MontXB"; font-size: 38px; color: #fff; }
      .chip i { display: block; width: 46px; height: 46px; border-radius: 50%; }
      #checks { z-index: 15; pointer-events: none; }
      #checks .card { left: 250px; top: 290px; width: 580px; height: 230px; padding: 30px 40px; }
      .ck { display: flex; align-items: center; gap: 22px; font-family: "MontBlack"; font-size: 52px; color: #fff; height: 85px; }
      .ck svg { width: 64px; height: 64px; }
      .ck svg circle { fill: var(--red2); }
      .ck svg path { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; }
      #stamp { z-index: 15; pointer-events: none; }
      #stamp .s { position: absolute; left: 190px; top: 560px; width: 700px; padding: 22px 0; border: 7px solid var(--red); border-radius: 22px; text-align: center;
        font-family: "MontBlack"; font-size: 76px; line-height: 1.0; letter-spacing: 3px; color: #fff; background: rgba(214,31,38,0.82); box-shadow: 0 16px 40px rgba(0,0,0,0.45); }
      #bulk { z-index: 15; pointer-events: none; }
      #bulk .h { position: absolute; left: 0; width: 1080px; top: 320px; text-align: center; font-family: "MontBlack"; font-size: 120px; line-height: 1; color: #fff; text-shadow: 0 8px 26px rgba(0,0,0,0.75); }
      #bulk .h span { color: var(--red); }
      #dm { z-index: 15; pointer-events: none; }
      #dm .card { left: 640px; top: 760px; width: 400px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 16px; }
      #dm .card b { font-family: "MontBlack"; font-size: 64px; color: #fff; }
      #dm .card svg { width: 62px; height: 62px; }

      /* ===== v05 motion graphics ===== */
      .chipg { display: flex; align-items: center; justify-content: center; gap: 14px; height: 84px; border-radius: 42px; background: var(--ink); border: 1px solid var(--line);
        font-family: "MontXB"; font-size: 36px; letter-spacing: 2px; color: #fff; }
      .chipg svg { width: 40px; height: 40px; }
      #coChip { z-index: 15; pointer-events: none; }
      #mgPanel { z-index: 3; pointer-events: none; background:
          radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1.5px, transparent 2px) 0 0 / 36px 36px,
          linear-gradient(180deg, #101217 0%, #14161d 82%, rgba(20,22,29,0) 100%); }
      #bp { position: absolute; inset: 0; opacity: 0; background:
          linear-gradient(rgba(120,180,255,0.10) 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(90deg, rgba(120,180,255,0.10) 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(180deg, #0c1a2b 0%, #0f2033 82%, rgba(15,32,51,0) 100%); }
      #mgGrid { z-index: 15; pointer-events: none; }
      #gNum { position: absolute; left: 110px; top: 300px; display: flex; align-items: baseline; gap: 18px; }
      #gNum b { font-family: "MontBlack"; font-size: 132px; line-height: 1; color: #fff; min-width: 170px; text-align: right; }
      #gNum span { font-family: "MontXB"; font-size: 40px; letter-spacing: 6px; color: var(--gold); }
      #gGift { position: absolute; left: 650px; top: 322px; display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 40px; background: var(--red2);
        font-family: "MontBlack"; font-size: 36px; color: #fff; letter-spacing: 2px; }
      #gGift svg { width: 42px; height: 42px; }
      #grid { position: absolute; left: 175px; top: 455px; width: 730px; display: grid; grid-template-columns: repeat(10, 64px); gap: 10px; }
      #grid svg { width: 64px; height: 64px; fill: #d61f26; stroke: #0c0c0c; stroke-width: 22; paint-order: stroke; }
      #mgLabel { z-index: 15; pointer-events: none; }
      #mgLabel span { position: absolute; left: 0; width: 1080px; top: 270px; text-align: center; font-family: "MontBlack"; font-size: 64px; letter-spacing: 3px; color: #fff; opacity: 0; }
      #mgLabel #lab1 { color: #cfe8ff; }
      #mgPlane { z-index: 15; pointer-events: none; }
      .lw { position: absolute; left: 330px; top: 350px; width: 420px; height: 420px; }
      .li { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .li svg { width: 420px; height: 420px; overflow: visible; transform-origin: 50% 50%; }
      .dim { position: absolute; left: 330px; top: 800px; width: 420px; height: 2px; background: rgba(207,232,255,0.6); }
      .dim::before, .dim::after { content: ""; position: absolute; top: -10px; width: 2px; height: 22px; background: rgba(207,232,255,0.6); }
      .dim::before { left: 0; } .dim::after { right: 0; }
      .dim.v { left: 290px; top: 350px; width: 2px; height: 420px; }
      .dim.v::before, .dim.v::after { left: -10px; width: 22px; height: 2px; top: 0; }
      .dim.v::after { top: auto; bottom: 0; right: auto; }
      .tag { position: absolute; left: 700px; display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 12px; border-radius: 34px; background: var(--ink); border: 1px solid var(--line);
        font-family: "MontBlack"; font-size: 32px; color: #fff; opacity: 0; }
      .tag i { display: block; width: 36px; height: 36px; border-radius: 50%; }
      .tag em { font-style: normal; font-family: "MontB"; font-size: 26px; color: rgba(255,255,255,0.7); }
      #tW { top: 385px; } #tR { top: 540px; } #tB { top: 700px; }
      #ship { z-index: 15; pointer-events: none; }
      #ship .card { left: 190px; top: 300px; width: 700px; height: 250px; overflow: hidden; background: var(--ink); }
      #box { position: absolute; left: 60px; top: 50px; width: 150px; height: 150px; overflow: visible; }
      
      #speed { position: absolute; left: 20px; top: 70px; width: 140px; height: 110px; opacity: 0; }
      #speed i { display: block; height: 6px; border-radius: 3px; margin: 18px 0; background: rgba(255,255,255,0.7); }
      #speed i:nth-child(2) { width: 70%; margin-left: 30%; }
      #shipT { position: absolute; left: 270px; top: 52px; font-family: "MontXB"; font-size: 46px; line-height: 1.12; color: #fff; }
      #shipT b { font-family: "MontBlack"; font-size: 76px; color: #fff; border-bottom: 8px solid var(--red); }
      #dm .dots { display: flex; gap: 8px; margin-left: 4px; }
      #dm .dots i { display: block; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
      /* end card */
      #endDim { z-index: 12; pointer-events: none; background: radial-gradient(ellipse 80% 55% at 50% 42%, rgba(11,11,13,0.72) 0%, rgba(11,11,13,0.9) 70%); }
      #end { z-index: 16; pointer-events: none; text-align: center; }
      #end img { position: absolute; left: 330px; top: 470px; width: 420px; height: auto; }
      #end .l1 { position: absolute; left: 0; width: 1080px; top: 960px; font-family: "MontBlack"; font-size: 60px; color: #fff; }
      #end .l2 { position: absolute; left: 0; width: 1080px; top: 1050px; }
      #end .l2 i { font-style: normal; display: inline-block; padding: 14px 34px; border-radius: 44px; background: var(--red2); font-family: "MontBlack"; font-size: 44px; color: #fff; letter-spacing: 1px; }

      /* warm light leak (organic-light-leak-overlay registry look), transitions only */
      .leak { z-index: 14; pointer-events: none; overflow: hidden; mix-blend-mode: screen; }
      .leak i { position: absolute; inset: -20%; }
      .leak .a { background: radial-gradient(ellipse 52% 110% at 12% 55%, rgb(255 236 190 / 80%), transparent 45%), radial-gradient(ellipse 72% 120% at 26% 52%, rgb(255 120 60 / 58%), transparent 66%); }
      .leak .g { background: linear-gradient(104deg, transparent 24%, rgb(255 150 80 / 22%) 40%, rgb(255 244 205 / 52%) 51%, rgb(255 120 60 / 18%) 62%, transparent 78%); }
      #brand img { position: absolute; left: 40px; top: 158px; width: 150px; height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%TOTAL%%" data-width="1080" data-height="1920">
%%VISUALS%%

      <!-- hook: readable without sound -->
      <div id="hook" class="clip" data-start="0" data-duration="2.3" data-track-index="5">
        <div class="k1"><span>50</span> CUSTOM<br />KEYCHAINS</div>
        <div class="k2"><i>for a company giveaway</i></div>
      </div>
      <svg width="0" height="0" style="position:absolute"><defs><symbol id="plane" viewBox="0 0 400 400"><path d="M200,24 C214,24 222,44 222,70 L222,150 L372,228 L372,252 L222,214 L222,298 L284,340 L284,360 L222,346 L218,362 C214,374 186,374 182,362 L178,346 L116,360 L116,340 L178,298 L178,214 L28,252 L28,228 L178,150 L178,70 C178,44 186,24 200,24 Z M90,176 h24 v46 h-24 Z M286,176 h24 v46 h-24 Z" /></symbol></defs></svg>
      <!-- company order chip over the speaker -->
      <div id="coChip" class="clip" data-start="%%CO_T%%" data-duration="%%CO_D%%" data-track-index="5" style="inset:auto;left:300px;top:740px;width:480px;height:84px">
        <div class="chipg"><svg viewBox="0 0 24 24"><path d="M3 21V5l7-3v6l7-3v16z M6 9h2v2H6z M6 13h2v2H6z M12 11h2v2h-2z M12 15h2v2h-2z" fill="#fff" /></svg>COMPANY ORDER</div>
      </div>
      <!-- motion-graphics panel above the b-roll (split section) -->
      <div id="mgPanel" class="clip" data-start="%%SPLIT_T%%" data-duration="%%SPLIT_D%%" data-track-index="3" style="inset:auto;left:0;top:0;width:1080px;height:1000px"><div id="bp"></div></div>
      <div id="mgGrid" class="clip" data-start="%%GRID_T%%" data-duration="%%GRID_D%%" data-track-index="5">
        <div id="gNum"><b id="gN">0</b><span>KEYCHAINS</span></div>
        <div id="gGift"><svg viewBox="0 0 24 24"><path d="M3 10h18v4H3z M5 14h14v7H5z M11 10h2v11h-2z M12 10C10 6 6 6 7 8.5 8 10 12 10 12 10z M12 10c2-4 6-4 5-1.5C16 10 12 10 12 10z" fill="#fff" /></svg>GIVEAWAY</div>
        <div id="grid">%%GRID%%</div>
      </div>
      <div id="mgLabel" class="clip" data-start="%%DES_T%%" data-duration="%%DES_D%%" data-track-index="5"><span id="lab1">MY DESIGN</span><span id="lab2">MULTI-COLOUR</span><span id="lab3">3 COLOURS</span></div>
      <div id="mgPlane" class="clip" data-start="%%DES_T%%" data-duration="%%PLANE_D%%" data-track-index="5">
        <div class="lw" id="wB"><div class="li" id="iB"><svg viewBox="0 0 400 400"><use href="#plane" fill="#0c0c0c" stroke="#0c0c0c" stroke-width="30" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(255,255,255,0.75)) drop-shadow(0 10px 18px rgba(0,0,0,0.6))" /></svg></div></div>
        <div class="lw" id="wR"><div class="li" id="iR"><svg viewBox="0 0 400 400"><use id="redFill" href="#plane" fill="#d61f26" /><path id="draw" d="M200,24 C214,24 222,44 222,70 L222,150 L372,228 L372,252 L222,214 L222,298 L284,340 L284,360 L222,346 L218,362 C214,374 186,374 182,362 L178,346 L116,360 L116,340 L178,298 L178,214 L28,252 L28,228 L178,150 L178,70 C178,44 186,24 200,24 Z M90,176 h24 v46 h-24 Z M286,176 h24 v46 h-24 Z" fill="none" stroke="#cfe8ff" stroke-width="3" stroke-dasharray="2600" stroke-dashoffset="2600" /></svg></div></div>
        <div class="lw" id="wW"><div class="li" id="iW"><svg viewBox="0 0 400 400"><text x="200" y="230" text-anchor="middle" transform="rotate(-90 200 200)" font-family="MontBlack" font-size="44" fill="#ffffff" letter-spacing="2">AVSEC</text></svg></div></div>
        <div class="dim" id="dimH"></div><div class="dim v" id="dimV"></div>
        <div class="tag" id="tW"><i style="background:#f4f4f4"></i>WHITE <em>print</em></div>
        <div class="tag" id="tR"><i style="background:#d61f26"></i>RED <em>body</em></div>
        <div class="tag" id="tB"><i style="background:#0c0c0c;box-shadow:inset 0 0 0 2px rgba(255,255,255,0.6)"></i>BLACK <em>base</em></div>
      </div>
      <div id="checks" class="clip" data-start="%%CHK_T%%" data-duration="%%CHK_D%%" data-track-index="5"><div class="card">
        <div class="ck" id="k1"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" /><path id="p1" d="M18 33 L28 43 L47 22" /></svg>DESIGN</div>
        <div class="ck" id="k2"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" /><path id="p2" d="M18 33 L28 43 L47 22" /></svg>PACKAGING</div>
      </div></div>
      <div id="ship" class="clip" data-start="%%SHIP_T%%" data-duration="%%SHIP_D%%" data-track-index="5"><div class="card">
        <div id="speed"><i></i><i></i><i></i></div>
        <svg id="box" viewBox="0 0 120 120"><path d="M14 44 L60 24 L106 44 L106 96 L60 116 L14 96 Z" fill="#c8915a" /><path d="M60 64 L106 44 L106 96 L60 116 Z" fill="#a8743f" /><path d="M14 44 L60 64 L60 116 L14 96 Z" fill="#b98250" />
          <path id="flapL" d="M14 44 L60 64 L42 80 L-4 60 Z" fill="#d9a46c" /><path id="flapR" d="M106 44 L60 64 L78 80 L124 60 Z" fill="#d9a46c" /><rect x="52" y="60" width="16" height="56" fill="#e8d3a8" opacity="0.7" /></svg>
        <div id="shipT">READY TO<br /><b>DELIVER</b></div>
      </div></div>
      <div id="bulk" class="clip" data-start="%%BULK_T%%" data-duration="%%BULK_D%%" data-track-index="5"><div class="h"><span>BULK</span><br />ORDERS</div></div>
      <div id="dm" class="clip" data-start="%%DM_T%%" data-duration="%%DM_D%%" data-track-index="5"><div class="card">
        <svg viewBox="0 0 24 24"><path d="M2 21 L23 12 L2 3 L2 10 L17 12 L2 14 Z" fill="#ff3b3b" /></svg><b>DM ME</b><span class="dots"><i id="d1"></i><i id="d2"></i><i id="d3"></i></span></div></div>

%%CAPTIONS%%

%%LEAKS%%

      <div id="endDim" class="clip" data-start="%%END_T%%" data-duration="%%END_D%%" data-track-index="6"></div>
      <div id="end" class="clip" data-start="%%END_T%%" data-duration="%%END_D%%" data-track-index="7">
        <img src="assets/logo_eshan.png" alt="Eshan Creations" />
        <div class="l1">Custom keychains · Bulk orders</div>
        <div class="l2"><i>DM TO ORDER</i></div>
      </div>
      <!-- persistent Eshan Creations logo (hidden while the end card shows it large) -->
      <div id="brand" class="clip" data-start="0" data-duration="%%END_T%%" data-track-index="9" style="z-index:30"><img src="assets/logo_eshan.png" alt="Eshan Creations" /></div>

      <audio id="dialogue" class="clip" src="assets/%%DLG%%" data-start="0" data-duration="%%SPEECH_END%%" data-volume="1"></audio>
      <audio id="music" data-timeline-role="music" class="clip" src="assets/music_bed.wav" data-start="0" data-duration="%%TOTAL%%" data-volume="1"></audio>
%%SFX%%
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
%%JS%%
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
