  <div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div data-hf-id="hf-4lv8" id="cg0" class="cap"><span data-hf-id="hf-n5ep">Security fills in the Acknowledgement of Receipt and brings the phone.</span></div>
    <div data-hf-id="hf-5dj1" id="cg1" class="cap"><span data-hf-id="hf-zpem">This guide is for staff handing items to Security, CBTO staff, and witnesses.</span></div>
    <div data-hf-id="hf-9bn2" id="cg2" class="cap"><span data-hf-id="hf-qrx8">Before, this was a printed paper form, signed with a pen.</span></div>
    <div data-hf-id="hf-d9r3" id="cg3" class="cap"><span data-hf-id="hf-i575">Now it is the same form, on the Security officer’s phone, and the signed PDF is</span></div>
    <div data-hf-id="hf-h7v4" id="cg4" class="cap"><span data-hf-id="hf-djyd">saved automatically.</span></div>
    <div data-hf-id="hf-hzix" id="cg5" class="cap"><span data-hf-id="hf-5mvk">Every form works in four steps.</span></div>
    <div data-hf-id="hf-lxmy" id="cg6" class="cap"><span data-hf-id="hf-d79z">Security fills the form, and hands you the phone.</span></div>
    <div data-hf-id="hf-s3cr" id="cg7" class="cap"><span data-hf-id="hf-hdwg">You check and sign.</span></div>
    <div data-hf-id="hf-w1gs" id="cg8" class="cap"><span data-hf-id="hf-l5xm">Then the phone goes back, and Security signs and saves.</span></div>
    <div data-hf-id="hf-wt4l" id="cg9" class="cap"><span data-hf-id="hf-xhr3">Blue is Security.</span></div>
    <div data-hf-id="hf-a8zj" id="cg10" class="cap"><span data-hf-id="hf-s814">Orange is you.</span></div>
    <div data-hf-id="hf-6avi" id="cg11" class="cap"><span data-hf-id="hf-5utn">There is nothing to install, and no account.</span></div>
    <div data-hf-id="hf-055p" id="cg12" class="cap"><span data-hf-id="hf-hhlh">Read the form before you sign, and sign only for yourself.</span></div>
    <div data-hf-id="hf-zdhw" id="cg13" class="cap"><span data-hf-id="hf-or9a">One form, two situations.</span></div>
    <div data-hf-id="hf-muzf" id="cg14" class="cap"><span data-hf-id="hf-xkaj">In Situation A, staff hand items to Security.</span></div>
    <div data-hf-id="hf-iwve" id="cg15" class="cap"><span data-hf-id="hf-fd2b">In Situation B, Security hands items to CBTO.</span></div>
    <div data-hf-id="hf-eyrd" id="cg16" class="cap"><span data-hf-id="hf-iy7f">In both, Security fills the form, the Recipient signs first, and a witness signs.</span></div>
    <div data-hf-id="hf-e73k" id="cg17" class="cap"><span data-hf-id="hf-9maf">Situation A: you hand items to Security.</span></div>
    <div data-hf-id="hf-1ol3" id="cg18" class="cap"><span data-hf-id="hf-ml72">Security signs first, as Recipient.</span></div>
    <div data-hf-id="hf-xqh2" id="cg19" class="cap"><span data-hf-id="hf-fana">In the app, the order is: Recipient, Security staff.</span></div>
    <div data-hf-id="hf-u22i" id="cg20" class="cap"><span data-hf-id="hf-onbh">Handed over by, you.</span></div>
    <div data-hf-id="hf-y06j" id="cg21" class="cap"><span data-hf-id="hf-oo70">Then the witness.</span></div>
    <div data-hf-id="hf-n4ow" id="cg22" class="cap"><span data-hf-id="hf-fld4">Security types all names, items and IDs first.</span></div>
    <div data-hf-id="hf-q3yh" id="cg23" class="cap"><span data-hf-id="hf-to9u">You only check and sign.</span></div>
    <div data-hf-id="hf-f8gu" id="cg24" class="cap"><span data-hf-id="hf-bh8y">Security passes you the phone.</span></div>
    <div data-hf-id="hf-j6kv" id="cg25" class="cap"><span data-hf-id="hf-dxhj">The orange box shows your name.</span></div>
    <div data-hf-id="hf-aip0" id="cg26" class="cap"><span data-hf-id="hf-1ci9">Check your name, your role, and the items listed.</span></div>
    <div data-hf-id="hf-bact" id="cg27" class="cap"><span data-hf-id="hf-hgu5">If everything is correct, sign with your finger and tap ‘Confirm’.</span></div>
    <div data-hf-id="hf-lho2" id="cg28" class="cap"><span data-hf-id="hf-kr42">Tap ‘Clear’ if you need to sign again.</span></div>
    <div data-hf-id="hf-pfs3" id="cg29" class="cap"><span data-hf-id="hf-vr2r">Next, the witness does the same: check their own name, sign, and tap ‘Confirm’.</span></div>
    <div data-hf-id="hf-hx4l" id="cg30" class="cap"><span data-hf-id="hf-ye2l">When the screen says so, the witness gives the phone back to Security.</span></div>
    <div data-hf-id="hf-h5gs" id="cg31" class="cap"><span data-hf-id="hf-v3gj">Security saves the record.</span></div>
    <div data-hf-id="hf-ptcn" id="cg32" class="cap"><span data-hf-id="hf-nbke">Situation B: Security hands items to CBTO.</span></div>
    <div data-hf-id="hf-lv8m" id="cg33" class="cap"><span data-hf-id="hf-00v1">CBTO staff sign first, as Recipient.</span></div>
    <div data-hf-id="hf-uj4h" id="cg34" class="cap"><span data-hf-id="hf-ltxo">In the app, the order is: Recipient, CBTO staff.</span></div>
    <div data-hf-id="hf-trgo" id="cg35" class="cap"><span data-hf-id="hf-ertc">Handed over by, Security staff.</span></div>
    <div data-hf-id="hf-4myb" id="cg36" class="cap"><span data-hf-id="hf-ufas">Then the witness.</span></div>
    <div data-hf-id="hf-0oua" id="cg37" class="cap"><span data-hf-id="hf-f2fi">Check every item listed is what you received.</span></div>
    <div data-hf-id="hf-qhj1" id="cg38" class="cap"><span data-hf-id="hf-6f2g">If you are the CBTO staff member, you sign first.</span></div>
    <div data-hf-id="hf-ppv8" id="cg39" class="cap"><span data-hf-id="hf-38na">Scroll up and check every item you received.</span></div>
    <div data-hf-id="hf-ih20" id="cg40" class="cap"><span data-hf-id="hf-ztn7">Sign with your finger and tap ‘Confirm’.</span></div>
    <div data-hf-id="hf-j8pt" id="cg41" class="cap"><span data-hf-id="hf-nc72">Tap ‘Clear’ to sign again.</span></div>
    <div data-hf-id="hf-n6tu" id="cg42" class="cap"><span data-hf-id="hf-9y9f">Pass the phone back to Security.</span></div>
    <div data-hf-id="hf-r4xv" id="cg43" class="cap"><span data-hf-id="hf-lts7">Security signs as ‘Handed over by’.</span></div>
    <div data-hf-id="hf-3ngc" id="cg44" class="cap"><span data-hf-id="hf-fcz3">Then the witness checks, signs and confirms.</span></div>
    <div data-hf-id="hf-4f45" id="cg45" class="cap"><span data-hf-id="hf-q4nw">The witness does the same: check their own name, sign, and tap ‘Confirm’.</span></div>
    <div data-hf-id="hf-akty" id="cg46" class="cap"><span data-hf-id="hf-mnrl">When the screen says so, the witness gives the phone back to Security.</span></div>
    <div data-hf-id="hf-eixz" id="cg47" class="cap"><span data-hf-id="hf-4xxf">Security saves the record.</span></div>
    <div data-hf-id="hf-r1gg" id="cg48" class="cap"><span data-hf-id="hf-66ex">This is a real Saved screen from a TEST record.</span></div>
    <div data-hf-id="hf-rt49" id="cg49" class="cap"><span data-hf-id="hf-arc5">The Record ID is in the PDF file name.</span></div>
    <div data-hf-id="hf-6c43" id="cg50" class="cap"><span data-hf-id="hf-fhj8">Security staff email the PDF to you.</span></div>
    <div data-hf-id="hf-2e02" id="cg51" class="cap"><span data-hf-id="hf-qgkb">Keep it for your records.</span></div>
    <div data-hf-id="hf-yfw1" id="cg52" class="cap"><span data-hf-id="hf-699d">Remember: check your name and role, and read the details before signing.</span></div>
    <div data-hf-id="hf-xo88" id="cg53" class="cap"><span data-hf-id="hf-mar0">Don’t sign for someone else, or if the details are wrong.</span></div>
    <div data-hf-id="hf-riif" id="cg54" class="cap"><span data-hf-id="hf-puz4">Don’t close the app, press Back, or take photos of the screen.</span></div>
    <div data-hf-id="hf-nkee" id="cg55" class="cap"><span data-hf-id="hf-7prm">Your signature goes into one signed PDF per form, with every signature and a Record ID.</span></div>
    <div data-hf-id="hf-jmad" id="cg56" class="cap"><span data-hf-id="hf-3bqt">It is kept in a restricted AirAsia folder, with a record log, and a PDF copy is emailed to you.</span></div>
