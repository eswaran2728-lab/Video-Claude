    <div data-hf-id="hf-a8zj" id="cg10" class="cap"><span data-hf-id="hf-xcna">Next, the witness checks their own name, signs, and taps ‘Confirm’.</span></div>

    <div data-hf-id="hf-muzf" id="cg14" class="cap"><span data-hf-id="hf-ywbg">Scroll up and check each item you received.</span></div>

    <div data-hf-id="hf-1ol3" id="cg18" class="cap"><span data-hf-id="hf-hypa">The witness checks their own name, signs, taps ‘Confirm’, and gives the phone back to Security.</span></div>
