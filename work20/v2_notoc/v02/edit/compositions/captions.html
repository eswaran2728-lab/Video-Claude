  <div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div data-hf-id="hf-4lv8" id="cg0" class="cap"><span data-hf-id="hf-rsdn">Security fills in the NOTOC form and hands the phone to you, the Captain.</span></div>
    <div data-hf-id="hf-5dj1" id="cg1" class="cap"><span data-hf-id="hf-rn0z">The NOTOC for firearms is now signed on a phone.</span></div>
    <div data-hf-id="hf-9bn2" id="cg2" class="cap"><span data-hf-id="hf-4amh">Here is what changed.</span></div>
    <div data-hf-id="hf-d9r3" id="cg3" class="cap"><span data-hf-id="hf-qrx8">Before, this was a printed paper form, signed with a pen.</span></div>
    <div data-hf-id="hf-h7v4" id="cg4" class="cap"><span data-hf-id="hf-qw9b">Now it is the same form, on the Security officer’s phone.</span></div>
    <div data-hf-id="hf-hzix" id="cg5" class="cap"><span data-hf-id="hf-ld4r">You sign with your finger, and the signed PDF is saved automatically, in a</span></div>
    <div data-hf-id="hf-lxmy" id="cg6" class="cap"><span data-hf-id="hf-7hns">restricted AirAsia folder.</span></div>
    <div data-hf-id="hf-s3cr" id="cg7" class="cap"><span data-hf-id="hf-5mvk">Every form works in four steps.</span></div>
    <div data-hf-id="hf-w1gs" id="cg8" class="cap"><span data-hf-id="hf-d79z">Security fills the form, and hands you the phone.</span></div>
    <div data-hf-id="hf-wt4l" id="cg9" class="cap"><span data-hf-id="hf-gpw0">You check, type your name and ID, and sign.</span></div>
    <div data-hf-id="hf-a8zj" id="cg10" class="cap"><span data-hf-id="hf-l5xm">Then the phone goes back, and Security signs and saves.</span></div>
    <div data-hf-id="hf-6avi" id="cg11" class="cap"><span data-hf-id="hf-xhr3">Blue is Security.</span></div>
    <div data-hf-id="hf-055p" id="cg12" class="cap"><span data-hf-id="hf-s814">Orange is you.</span></div>
    <div data-hf-id="hf-zdhw" id="cg13" class="cap"><span data-hf-id="hf-yjaw">You need nothing to install, and no account.</span></div>
    <div data-hf-id="hf-muzf" id="cg14" class="cap"><span data-hf-id="hf-yrcf">Security brings the phone.</span></div>
    <div data-hf-id="hf-iwve" id="cg15" class="cap"><span data-hf-id="hf-bo6g">Have your own name and ID or staff number ready.</span></div>
    <div data-hf-id="hf-eyrd" id="cg16" class="cap"><span data-hf-id="hf-bvzi">Read the form before you sign, and if it is wrong, say so.</span></div>
    <div data-hf-id="hf-e73k" id="cg17" class="cap"><span data-hf-id="hf-pw2g">Sign only for yourself.</span></div>
    <div data-hf-id="hf-1ol3" id="cg18" class="cap"><span data-hf-id="hf-aemf">This part is for the Captain, the Pilot in Command.</span></div>
    <div data-hf-id="hf-xqh2" id="cg19" class="cap"><span data-hf-id="hf-0rjs">Security fills, the Captain checks and signs, and Security signs and saves.</span></div>
    <div data-hf-id="hf-u22i" id="cg20" class="cap"><span data-hf-id="hf-4frd">This is the paper form we used.</span></div>
    <div data-hf-id="hf-y06j" id="cg21" class="cap"><span data-hf-id="hf-2a6o">Security fills the firearm details, and signs as ‘Loaded by’.</span></div>
    <div data-hf-id="hf-n4ow" id="cg22" class="cap"><span data-hf-id="hf-bycu">The Captain checks the flight and firearm details, types their own name and ID, and</span></div>
    <div data-hf-id="hf-q3yh" id="cg23" class="cap"><span data-hf-id="hf-clb0">signs to acknowledge.</span></div>
    <div data-hf-id="hf-f8gu" id="cg24" class="cap"><span data-hf-id="hf-mmp6">In the app, Security fills the form, then hands you the phone.</span></div>
    <div data-hf-id="hf-j6kv" id="cg25" class="cap"><span data-hf-id="hf-yo7j">Tap the orange button marked ‘Captain has the phone’.</span></div>
    <div data-hf-id="hf-aip0" id="cg26" class="cap"><span data-hf-id="hf-tgf6">Check the flight details.</span></div>
    <div data-hf-id="hf-bact" id="cg27" class="cap"><span data-hf-id="hf-xzei">Review every firearm line on the form, and check the ‘Loaded by’ name.</span></div>
    <div data-hf-id="hf-lho2" id="cg28" class="cap"><span data-hf-id="hf-aaja">If everything is correct, type your own name in ‘Acknowledged by’.</span></div>
    <div data-hf-id="hf-pfs3" id="cg29" class="cap"><span data-hf-id="hf-9ah4">Enter your ID number.</span></div>
    <div data-hf-id="hf-hx4l" id="cg30" class="cap"><span data-hf-id="hf-2u4r">Sign in the box with your finger.</span></div>
    <div data-hf-id="hf-h5gs" id="cg31" class="cap"><span data-hf-id="hf-qz8s">If you need to sign again, tap ‘Clear’.</span></div>
    <div data-hf-id="hf-ptcn" id="cg32" class="cap"><span data-hf-id="hf-xi5g">If anything in the form is wrong, tap ‘Something is wrong’ and give the phone back</span></div>
    <div data-hf-id="hf-lv8m" id="cg33" class="cap"><span data-hf-id="hf-8bnz">to Security for correction.</span></div>
    <div data-hf-id="hf-uj4h" id="cg34" class="cap"><span data-hf-id="hf-wzrp">When your signature is ready, tap ‘Confirm my signature’.</span></div>
    <div data-hf-id="hf-trgo" id="cg35" class="cap"><span data-hf-id="hf-zj16">When the screen says so, give the phone back to Security.</span></div>
    <div data-hf-id="hf-4myb" id="cg36" class="cap"><span data-hf-id="hf-iuwo">Security signs and saves the record.</span></div>
    <div data-hf-id="hf-0oua" id="cg37" class="cap"><span data-hf-id="hf-66ex">This is a real Saved screen from a TEST record.</span></div>
    <div data-hf-id="hf-qhj1" id="cg38" class="cap"><span data-hf-id="hf-1myy">The app creates the signed PDF, and the Record ID is in the PDF file name.</span></div>
    <div data-hf-id="hf-ppv8" id="cg39" class="cap"><span data-hf-id="hf-fhj8">Security staff email the PDF to you.</span></div>
    <div data-hf-id="hf-ih20" id="cg40" class="cap"><span data-hf-id="hf-qgkb">Keep it for your records.</span></div>
    <div data-hf-id="hf-j8pt" id="cg41" class="cap"><span data-hf-id="hf-rvry">Remember: check your name and role on screen, and read the details before signing.</span></div>
    <div data-hf-id="hf-n6tu" id="cg42" class="cap"><span data-hf-id="hf-pows">Type your own name and ID if asked.</span></div>
    <div data-hf-id="hf-r4xv" id="cg43" class="cap"><span data-hf-id="hf-u5c2">Sign with your finger, then Confirm, and hand the phone back to Security.</span></div>
    <div data-hf-id="hf-3ngc" id="cg44" class="cap"><span data-hf-id="hf-mar0">Don’t sign for someone else, or if the details are wrong.</span></div>
    <div data-hf-id="hf-4f45" id="cg45" class="cap"><span data-hf-id="hf-puz4">Don’t close the app, press Back, or take photos of the screen.</span></div>
    <div data-hf-id="hf-akty" id="cg46" class="cap"><span data-hf-id="hf-7prm">Your signature goes into one signed PDF per form, with every signature and a Record ID.</span></div>
    <div data-hf-id="hf-eixz" id="cg47" class="cap"><span data-hf-id="hf-7jtm">It is saved to a restricted AirAsia folder, with a record log.</span></div>
    <div data-hf-id="hf-r1gg" id="cg48" class="cap"><span data-hf-id="hf-7ooz">A PDF copy of the signed NOTOC is shared with you by email.</span></div>
    <div data-hf-id="hf-rt49" id="cg49" class="cap"><span data-hf-id="hf-pt45">Have a question?</span></div>
    <div data-hf-id="hf-6c43" id="cg50" class="cap"><span data-hf-id="hf-b6r6">Ask the Security staff on duty.</span></div>
